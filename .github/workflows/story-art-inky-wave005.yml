name: Story art draft — Inky wave 005
on:
  push:
    branches:
      - art/inky-wave-005-draft-panels
    paths:
      - scripts/produce_inky_wave005.py
      - scripts/produce_inky_wave005_referenced.py
      - .github/workflows/story-art-inky-wave005.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-five-panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate separate 1280x720 PNG masters and WebP runtime mirrors
        run: python scripts/produce_inky_wave005_referenced.py
      - name: Validate human-review hold and exact runtime constraints
        run: |
          python scripts/prepare_story_art_600_runtime.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json
          repo=Path('.')
          data=json.loads((repo/'assets/data/story_art_600_manifest.json').read_text())
          rows=[r for r in data['images'] if r['character_id']=='inky' and int(r['wave'])==5]
          assert len(rows)==5
          hs=[]
          for r in rows:
              a=repo/r['expected_source_path']; b=repo/r['expected_web_path']
              assert a.is_file() and b.is_file()
              assert a.read_bytes()==b.read_bytes()
              assert len(a.read_bytes())<=300_000
              with Image.open(a) as im:
                  assert im.size==(1280,720) and im.format=='WEBP'
              h=hashlib.sha256(a.read_bytes()).hexdigest()
              assert r['source_sha256']==r['web_sha256']==h
              assert r['status']=='awaiting_human_review' and all(v=='pending' for v in r['qa'].values())
              hs.append(h)
          assert len(set(hs))==5
          print('PASS: 5 unique panels; 1280x720; mirrored; 300KB cap; pending human review')
          PY
      - name: Story expansion regression — allow pending art, forbid unapproved runtime
        run: node test/story_expansion_regression.js
      - name: Commit draft media to branch without approving it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/story_art_600_manifest.json \
            assets/sprites/story/panels_600/inky \
            build/web/assets/sprites/story/panels_600/inky \
            docs/story-art-600/artist-master-archive/inky/wave_005
          if ! git diff --cached --quiet; then
            git commit -m "art(story): stage five wave-005 panels awaiting human review"
            git push origin HEAD:art/inky-wave-005-draft-panels
          fi
